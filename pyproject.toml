[build-system]
requires = ["setuptools>=71.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vasp-util"
version = "0.0.8"
description = "Utilities for working with VASP input files and crystal structures."
authors = [
    { name = "Kengo NAKADA", email = "kengo.nakada@email.com" },
    { name = "Kentaro Kobayashi", email = "kobayashi@mat.shimane-u.ac.jp" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xlogger-py",
    "packmol-util",
    "rmc-util",
    "pymatgen",
    "coloredlogs",
    "colorlog",
    "pyyaml",
    "toml",
    "nest_asyncio",
    "pytest",
    "pytest-asyncio",
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py"
]


[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[project.scripts]
vasp_util = "vasp_util.install:main"

[tool.setuptools.data-files]
"share/vasp_util/scripts" = ["scripts/*.py", "scripts/*.sh"]
